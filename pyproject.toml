[project]
name = "peek"
version = "0.1.0"
description = "Look at something, say what you want, and your Mac does it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cartesia[websockets]>=4.2.0",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-contrib-python>=5.0.0",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
]

[project.scripts]
peek = "peek.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peek"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
